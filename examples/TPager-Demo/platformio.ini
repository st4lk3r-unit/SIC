; Example project using SIC on LilyGo T-Pager
[env:tpager]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.psram = enabled
lib_ldf_mode = deep+
build_flags =
  -DSIC_TARGET_TPAGER=1
  ; I2C bus for TCA8418, BQ27220, etc.
  -DI2C_SDA_PIN=3
  -DI2C_SCL_PIN=2
  ; TCA8418 keyboard controller on I2C 0x34, INT on GPIO 6
  -DTCA8418_INT_PIN=6
  -DSIC_DRV_KBD_TCA8418=1
  ; BQ27220 battery fuel gauge on I2C 0x55
  -DSIC_BATTERY_BQ27220=1
  ;
  ; SGFX display flags (pass to SGFX if used alongside this SIC example)
  -DSGFX_DRV_ST7796=1
  -DSGFX_BUS_SPI=1
  -DSGFX_W=480
  -DSGFX_H=222
  -DSGFX_ROT=1
  -DSGFX_PIN_SCK=35
  -DSGFX_PIN_MOSI=34
  -DSGFX_PIN_MISO=-1
  -DSGFX_PIN_CS=38
  -DSGFX_PIN_DC=37
  -DSGFX_PIN_RST=-1
  -DSGFX_PIN_BL=42
  -DSGFX_SPI_HZ=80000000
  -DSGFX_BGR=1
  -DSGFX_INVERT=1
  -DSGFX_COLSTART=49
  -DSGFX_ROWSTART=0
  -DSGFX_MIRROR_Y=1
lib_deps =
  ; The SIC library is in the parent folder when used locally; when published, specify its name here.
